<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORTA Platform Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtitle {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .form-input:focus {
            outline: none;
            border-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            background: #1a1a1a;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-email {
            color: #888;
            font-size: 13px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: transparent;
            color: #888;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-logout:hover {
            color: #fff;
            border-color: #666;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
        }

        .btn-create {
            padding: 10px 20px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Tenant List */
        .tenant-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tenant-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tenant-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tenant-slug {
            color: #888;
            font-size: 13px;
            font-family: monospace;
        }

        .tenant-meta {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .tenant-actions {
            display: flex;
            gap: 8px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-badge.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .status-badge.service-mode {
            background: rgba(124, 58, 237, 0.2);
            color: #7c3aed;
        }

        .btn-toggle {
            padding: 6px 12px;
            background: transparent;
            color: #888;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-toggle:hover {
            color: #fff;
            border-color: #666;
        }

        .service-mode-controls {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .service-mode-label {
            font-size: 13px;
            color: #888;
        }

        .service-mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-count-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-count-control label {
            font-size: 13px;
            color: #888;
        }

        .table-count-control input {
            width: 60px;
            padding: 6px 8px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            text-align: center;
        }

        .table-count-control input:disabled {
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state p {
            margin-bottom: 20px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: #888;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-submit {
            flex: 1;
            padding: 12px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #333;
            margin-bottom: 24px;
        }
        .tab {
            padding: 12px 20px;
            background: transparent;
            color: #888;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: -1px;
        }
        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* Event card */
        .event-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .event-card:hover {
            background: #222;
        }
        .event-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .event-meta {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .event-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* QR detail layout */
        .qr-detail {
            text-align: center;
        }
        .qr-detail #eventQrOutput {
            display: inline-block;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
        }
        .qr-detail-meta {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .btn-danger {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: #ef4444;
            border: 1px solid #5b1a1a;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.08);
        }
        .btn-danger:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1 class="login-title">Platform Admin</h1>
            <p class="login-subtitle">Sign in with your SUPER_ADMIN account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-input" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                <p id="loginError" class="error-msg" style="display: none;"></p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <header class="header">
            <h1 class="header-title">QORTA Platform</h1>
            <div class="header-user">
                <span class="header-email" id="userEmail"></span>
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </header>

        <div class="container">
            <div class="tabs" role="tablist">
                <button class="tab active" id="tab-btn-restaurants" onclick="switchTab('restaurants')">Restaurants</button>
                <button class="tab" id="tab-btn-events" onclick="switchTab('events')">Events</button>
            </div>

            <!-- Restaurants tab (existing flow, untouched) -->
            <div class="tab-panel active" id="tab-restaurants">
                <div class="section-header">
                    <h2 class="section-title">Tenants</h2>
                    <button class="btn-create" onclick="openCreateModal()">+ Create Tenant</button>
                </div>

                <div id="tenantList" class="tenant-list">
                    <div class="loading">Loading tenants...</div>
                </div>
            </div>

            <!-- Events tab -->
            <div class="tab-panel" id="tab-events">
                <div class="section-header">
                    <h2 class="section-title">Events</h2>
                    <button class="btn-create" onclick="openCreateEventModal()">+ Create Event</button>
                </div>

                <div id="eventList" class="tenant-list">
                    <div class="loading">Loading events...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="createEventModal" class="modal-overlay" onclick="if(event.target===this)closeCreateEventModal()">
        <div class="modal">
            <h2 class="modal-title">Create Event</h2>
            <form id="createEventForm">
                <div class="form-group">
                    <label class="form-label">Restaurant (Tenant)</label>
                    <select id="eventTenantId" class="form-input" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Event Name</label>
                    <input type="text" id="eventName" class="form-input" placeholder="e.g. Chef Edwin's Birthday" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Event Date (optional)</label>
                    <input type="date" id="eventDate" class="form-input">
                </div>
                <p id="createEventError" class="error-msg" style="display:none;"></p>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeCreateEventModal()">Cancel</button>
                    <button type="submit" class="btn-submit" id="createEventBtn">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Event Detail Modal -->
    <div id="eventDetailModal" class="modal-overlay" onclick="if(event.target===this)closeEventDetailModal()">
        <div class="modal qr-detail">
            <h2 class="modal-title" id="eventDetailName">Event</h2>
            <p class="qr-detail-meta">
                <span id="eventDetailDate"></span><br>
                <span id="eventDetailStatus"></span>
            </p>

            <div id="eventQrOutput"></div>

            <p class="qr-detail-meta" id="eventQrUrl"></p>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeEventDetailModal()">Close</button>
                <button type="button" class="btn-danger" id="eventDeactivateBtn" onclick="deactivateCurrentEvent()">Deactivate</button>
                <button type="button" class="btn-submit" onclick="downloadEventQR()">Download PNG</button>
            </div>
        </div>
    </div>

    <!-- Create Tenant Modal -->
    <div id="createModal" class="modal-overlay" onclick="if(event.target===this)closeCreateModal()">
        <div class="modal">
            <h2 class="modal-title">Create New Tenant</h2>

            <form id="createForm">
                <div class="form-group">
                    <label class="form-label">Restaurant Name</label>
                    <input type="text" id="tenantName" class="form-input" placeholder="e.g. Pizza Palace" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Slug (URL path)</label>
                    <input type="text" id="tenantSlug" class="form-input" placeholder="e.g. pizza-palace" pattern="^[a-z0-9]+(-[a-z0-9]+)*$" required>
                    <small style="color: #666; font-size: 11px;">Lowercase letters, numbers, and hyphens only</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="admin@restaurant.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Admin Name (optional)</label>
                    <input type="text" id="adminName" class="form-input" placeholder="John Smith">
                </div>

                <p id="createError" class="error-msg" style="display: none;"></p>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
                    <button type="submit" class="btn-submit" id="createBtn">Create Tenant</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal-overlay" onclick="if(event.target===this)closeQRModal()">
        <div class="modal">
            <h2 class="modal-title">QR Code</h2>
            <p id="qrTenantName" style="color:#888;margin-bottom:16px;"></p>

            <div style="margin-bottom:16px;">
                <label class="form-label">Type</label>
                <select id="qrType" onchange="generateQR()" class="form-input">
                    <option value="menu">Menu QR</option>
                    <option value="table">Table QR</option>
                </select>
            </div>

            <div id="tableInput" style="display:none;margin-bottom:16px;">
                <label class="form-label">Table Number</label>
                <input type="number" id="tableNumber" min="1" value="1" oninput="generateQR()" class="form-input">
            </div>

            <div id="qrOutput" style="text-align:center;padding:20px;background:#fff;border-radius:8px;margin-bottom:16px;"></div>

            <p id="qrUrl" style="font-size:12px;color:#666;word-break:break-all;margin-bottom:16px;text-align:center;"></p>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeQRModal()">Close</button>
                <button type="button" class="btn-submit" onclick="downloadQR()">Download PNG</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // Firebase config (same as rest of app)
        const firebaseConfig = {
            apiKey: "AIzaSyBzeIm1dZc26w3ZLDBqkRTk3hUx-qYW978",
            authDomain: "qorta-production.firebaseapp.com",
            projectId: "qorta-production"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUser = null;
        let authToken = null;

        // Check auth state on load
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Force token refresh to get latest custom claims
                const tokenResult = await user.getIdTokenResult(true);
                console.log('Firebase ID Token Claims:', tokenResult.claims);
                console.log('Role claim:', tokenResult.claims.role);
                console.log('Expected: SUPER_ADMIN');

                if (tokenResult.claims.role === 'SUPER_ADMIN') {
                    currentUser = user;
                    authToken = tokenResult.token;
                    showDashboard();
                } else {
                    const errorMsg = `Access denied. Current role: ${tokenResult.claims.role || 'none'}. Required: SUPER_ADMIN`;
                    console.error(errorMsg);
                    showError(errorMsg);
                    setTimeout(() => auth.signOut(), 3000);
                }
            } else {
                showLogin();
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorEl.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('userEmail').textContent = currentUser.email;
            loadTenants();
        }

        function showError(msg) {
            document.getElementById('loginError').textContent = msg;
            document.getElementById('loginError').style.display = 'block';
        }

        function logout() {
            auth.signOut();
        }

        // Load tenants
        async function loadTenants() {
            const listEl = document.getElementById('tenantList');
            listEl.innerHTML = '<div class="loading">Loading tenants...</div>';

            try {
                const res = await fetch('/api/platform/tenants', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();

                if (!data.success) {
                    listEl.innerHTML = `<div class="error-msg">${data.error}</div>`;
                    return;
                }

                if (data.data.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <p>No tenants yet</p>
                            <button class="btn-create" onclick="openCreateModal()">Create your first tenant</button>
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = data.data.map(tenant => {
                    const serviceMode = tenant.serviceMode || { enabled: false, tableCount: 10 };
                    return `
                    <div class="tenant-card">
                        <div style="width: 100%;">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div class="tenant-info">
                                    <h3>${escapeHtml(tenant.name)}</h3>
                                    <span class="tenant-slug">/${tenant.slug}</span>
                                    <div class="tenant-meta">
                                        <span>Plan: ${tenant.plan}</span>
                                        <span>Created: ${new Date(tenant.createdAt).toLocaleDateString()}</span>
                                    </div>
                                </div>
                                <div class="tenant-actions">
                                    <span class="status-badge ${tenant.isActive ? 'active' : 'inactive'}">
                                        ${tenant.isActive ? 'Active' : 'Inactive'}
                                    </span>
                                    ${serviceMode.enabled ? '<span class="status-badge service-mode">Service Mode</span>' : ''}
                                    <button class="btn-toggle" onclick="openQRModal('${tenant.slug}', '${escapeHtml(tenant.name)}')">
                                        QR
                                    </button>
                                    <button class="btn-toggle" onclick="toggleStatus('${tenant.id}', ${!tenant.isActive})">
                                        ${tenant.isActive ? 'Deactivate' : 'Activate'}
                                    </button>
                                </div>
                            </div>
                            <div class="service-mode-controls">
                                <span class="service-mode-label">Service Mode:</span>
                                <div class="service-mode-toggle">
                                    <input type="checkbox"
                                        id="serviceMode-${tenant.id}"
                                        ${serviceMode.enabled ? 'checked' : ''}
                                        onchange="toggleServiceMode('${tenant.id}', this.checked)">
                                    <label for="serviceMode-${tenant.id}" style="font-size: 13px; color: #888;">
                                        ${serviceMode.enabled ? 'Enabled' : 'Disabled'}
                                    </label>
                                </div>
                                <div class="table-count-control">
                                    <label>Tables:</label>
                                    <input type="number"
                                        min="1"
                                        max="100"
                                        value="${serviceMode.tableCount}"
                                        id="tableCount-${tenant.id}"
                                        ${!serviceMode.enabled ? 'disabled' : ''}
                                        onchange="updateTableCount('${tenant.id}', this.value)">
                                </div>
                            </div>
                        </div>
                    </div>
                `}).join('');

            } catch (error) {
                listEl.innerHTML = `<div class="error-msg">Failed to load tenants</div>`;
            }
        }

        // Toggle tenant status
        async function toggleStatus(id, isActive) {
            try {
                const res = await fetch(`/api/platform/tenants/${id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ isActive })
                });

                if (res.ok) {
                    loadTenants();
                }
            } catch (error) {
                alert('Failed to update status');
            }
        }

        // Create tenant modal
        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
            document.getElementById('createForm').reset();
            document.getElementById('createError').style.display = 'none';
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('createBtn');
            const errorEl = document.getElementById('createError');

            const payload = {
                name: document.getElementById('tenantName').value,
                slug: document.getElementById('tenantSlug').value.toLowerCase(),
                adminEmail: document.getElementById('adminEmail').value,
                adminName: document.getElementById('adminName').value || undefined
            };

            btn.disabled = true;
            btn.textContent = 'Creating...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/platform/tenants', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!data.success) {
                    errorEl.textContent = data.error;
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Create Tenant';
                    return;
                }

                closeCreateModal();
                loadTenants();
                alert(`Tenant created! Admin will receive password reset email at ${payload.adminEmail}`);

            } catch (error) {
                errorEl.textContent = 'Failed to create tenant';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Tenant';
            }
        });

        // Auto-generate slug from name
        document.getElementById('tenantName').addEventListener('input', (e) => {
            const slugInput = document.getElementById('tenantSlug');
            if (!slugInput.dataset.manual) {
                slugInput.value = e.target.value
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '');
            }
        });

        document.getElementById('tenantSlug').addEventListener('input', () => {
            document.getElementById('tenantSlug').dataset.manual = 'true';
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Service Mode toggle
        async function toggleServiceMode(tenantId, enabled) {
            const checkbox = document.getElementById(`serviceMode-${tenantId}`);
            const tableCountInput = document.getElementById(`tableCount-${tenantId}`);
            const tableCount = parseInt(tableCountInput.value) || 10;

            // Disable during request to prevent double-clicks
            checkbox.disabled = true;

            try {
                const res = await fetch(`/api/platform/tenants/${tenantId}/service-mode`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        enabled,
                        tableCount
                    })
                });

                if (res.ok) {
                    // Update UI optimistically without full reload
                    tableCountInput.disabled = !enabled;
                    checkbox.disabled = false;

                    // Silently reload tenant list in background to update badge
                    setTimeout(() => loadTenants(), 500);
                } else {
                    const data = await res.json();
                    console.error('Failed to toggle service mode:', data.error);
                    // Revert checkbox
                    checkbox.checked = !enabled;
                    checkbox.disabled = false;
                }
            } catch (error) {
                console.error('Failed to toggle service mode:', error);
                // Revert checkbox
                checkbox.checked = !enabled;
                checkbox.disabled = false;
            }
        }

        // Update table count
        async function updateTableCount(tenantId, tableCount) {
            const count = parseInt(tableCount);
            const input = document.getElementById(`tableCount-${tenantId}`);

            if (count < 1 || count > 100) {
                console.error('Table count must be between 1 and 100');
                // Revert to previous valid value
                input.value = 10;
                return;
            }

            // Disable during request
            input.disabled = true;

            try {
                const checkbox = document.getElementById(`serviceMode-${tenantId}`);
                const enabled = checkbox.checked;

                const res = await fetch(`/api/platform/tenants/${tenantId}/service-mode`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        enabled,
                        tableCount: count
                    })
                });

                if (res.ok) {
                    input.disabled = !enabled;
                } else {
                    console.error('Failed to update table count');
                    input.disabled = !enabled;
                }
            } catch (error) {
                console.error('Failed to update table count:', error);
                input.disabled = !enabled;
            }
        }

        // QR Code functions
        let currentQRSlug = '';

        function openQRModal(slug, name) {
            currentQRSlug = slug;
            document.getElementById('qrTenantName').textContent = name;
            document.getElementById('qrType').value = 'menu';
            document.getElementById('tableInput').style.display = 'none';
            document.getElementById('qrModal').classList.add('active');
            generateQR();
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }

        let qrInstance = null;

        function generateQR() {
            const type = document.getElementById('qrType').value;
            const tableInput = document.getElementById('tableInput');

            tableInput.style.display = type === 'table' ? 'block' : 'none';

            let url = `${window.location.origin}/${currentQRSlug}/menu`;
            if (type === 'table') {
                const tableNum = document.getElementById('tableNumber').value || 1;
                url += `?table=${tableNum}`;
            }

            document.getElementById('qrUrl').textContent = url;
            const output = document.getElementById('qrOutput');
            output.innerHTML = '';

            // Generate QR using qrcodejs
            qrInstance = new QRCode(output, {
                text: url,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff'
            });
        }

        function downloadQR() {
            const img = document.querySelector('#qrOutput img');
            const canvas = document.querySelector('#qrOutput canvas');
            const type = document.getElementById('qrType').value;
            const tableNum = document.getElementById('tableNumber').value;
            const filename = type === 'table'
                ? `${currentQRSlug}-table-${tableNum}.png`
                : `${currentQRSlug}-menu.png`;

            const link = document.createElement('a');
            link.download = filename;

            if (canvas) {
                link.href = canvas.toDataURL();
                link.click();
            } else if (img) {
                link.href = img.src;
                link.click();
            }
        }

        // ================== EVENTS TAB ==================

        // Active = 'active', anything else (currently 'inactive') is rendered as inactive.
        const EVENT_STATUS_ACTIVE = 'active';
        let currentEventDetail = null;

        function switchTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${name}`).classList.add('active');
            document.getElementById(`tab-btn-${name}`).classList.add('active');

            if (name === 'events') {
                loadEvents();
            }
        }

        async function loadEvents() {
            const listEl = document.getElementById('eventList');
            listEl.innerHTML = '<div class="loading">Loading events...</div>';

            try {
                const res = await fetch('/api/platform/events', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();

                if (!data.success) {
                    listEl.innerHTML = `<div class="error-msg">${escapeHtml(data.error || 'Failed to load events')}</div>`;
                    return;
                }

                if (!data.data || data.data.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <p>No events yet. Create your first event.</p>
                            <button class="btn-create" onclick="openCreateEventModal()">+ Create Event</button>
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = data.data.map(ev => {
                    const isActive = ev.status === EVENT_STATUS_ACTIVE;
                    return `
                    <div class="event-card" onclick="openEventDetail('${ev.id}')">
                        <div class="event-info">
                            <h3>${escapeHtml(ev.name)}</h3>
                            <span class="tenant-slug">/event/${escapeHtml(ev.slug)}</span>
                            <div class="event-meta">
                                <span>${ev.date ? escapeHtml(new Date(ev.date).toLocaleDateString()) : 'No date set'}</span>
                                <span>${ev.tenantName ? 'Restaurant: ' + escapeHtml(ev.tenantName) : ''}</span>
                            </div>
                        </div>
                        <div class="event-actions">
                            <span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
                            <button class="btn-toggle" onclick="event.stopPropagation(); openEventDetail('${ev.id}')">View QR</button>
                        </div>
                    </div>
                `;
                }).join('');
            } catch (error) {
                listEl.innerHTML = `<div class="error-msg">Failed to load events</div>`;
            }
        }

        async function openCreateEventModal() {
            const modal = document.getElementById('createEventModal');
            const tenantSelect = document.getElementById('eventTenantId');
            const errorEl = document.getElementById('createEventError');

            errorEl.style.display = 'none';
            document.getElementById('createEventForm').reset();

            tenantSelect.innerHTML = '<option value="">Loading tenants...</option>';
            modal.classList.add('active');

            // Always fetch fresh — cheap, and avoids stale data after a tenant
            // is created in the Restaurants tab during the same session.
            let tenants = [];
            try {
                const res = await fetch('/api/platform/tenants', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (data.success) tenants = (data.data || []).filter(t => t.isActive);
            } catch (e) { /* leave empty */ }

            if (tenants.length === 0) {
                tenantSelect.innerHTML = '<option value="">No tenants available</option>';
                return;
            }

            tenantSelect.innerHTML = '<option value="">Select a restaurant…</option>' +
                tenants.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
        }

        function closeCreateEventModal() {
            document.getElementById('createEventModal').classList.remove('active');
        }

        document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createEventBtn');
            const errorEl = document.getElementById('createEventError');

            const name = document.getElementById('eventName').value.trim();
            const date = document.getElementById('eventDate').value || null;
            const tenantId = document.getElementById('eventTenantId').value;

            if (!name) {
                errorEl.textContent = 'Event name is required.';
                errorEl.style.display = 'block';
                return;
            }
            if (!tenantId) {
                errorEl.textContent = 'Please select a restaurant.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/platform/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, date, tenantId })
                });
                const data = await res.json();

                if (!data.success) {
                    errorEl.textContent = data.error || 'Failed to create event';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Create Event';
                    return;
                }

                closeCreateEventModal();
                await loadEvents();
                openEventDetail(data.data.id);
            } catch (err) {
                errorEl.textContent = 'Failed to create event';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Event';
            }
        });

        async function openEventDetail(eventId) {
            try {
                const res = await fetch(`/api/platform/events/${eventId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.error || 'Failed to load event');
                    return;
                }
                currentEventDetail = data.data;
                const isActive = currentEventDetail.status === EVENT_STATUS_ACTIVE;

                document.getElementById('eventDetailName').textContent = currentEventDetail.name;
                document.getElementById('eventDetailDate').textContent = currentEventDetail.date
                    ? `Date: ${new Date(currentEventDetail.date).toLocaleDateString()}`
                    : 'No date set';
                document.getElementById('eventDetailStatus').textContent = `Status: ${currentEventDetail.status}`;
                document.getElementById('eventQrUrl').textContent = currentEventDetail.qrUrl || '';

                const deactivateBtn = document.getElementById('eventDeactivateBtn');
                deactivateBtn.textContent = isActive ? 'Deactivate' : 'Inactive';
                deactivateBtn.disabled = !isActive;

                // QR ≥ 300×300 per spec
                const output = document.getElementById('eventQrOutput');
                output.innerHTML = '';
                new QRCode(output, {
                    text: currentEventDetail.qrUrl || `${window.location.origin}/event/${currentEventDetail.slug}`,
                    width: 320,
                    height: 320,
                    colorDark: '#000000',
                    colorLight: '#ffffff'
                });

                document.getElementById('eventDetailModal').classList.add('active');
            } catch (e) {
                alert('Failed to load event');
            }
        }

        function closeEventDetailModal() {
            document.getElementById('eventDetailModal').classList.remove('active');
            // Drop the QR DOM so it doesn't linger in memory between opens.
            const output = document.getElementById('eventQrOutput');
            if (output) output.innerHTML = '';
            currentEventDetail = null;
        }

        function downloadEventQR() {
            if (!currentEventDetail) return;
            const canvas = document.querySelector('#eventQrOutput canvas');
            const img = document.querySelector('#eventQrOutput img');
            const safeName = (currentEventDetail.name || 'event')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
            const filename = `${safeName}-qr.png`;
            const link = document.createElement('a');
            link.download = filename;
            if (canvas) {
                link.href = canvas.toDataURL();
                link.click();
            } else if (img) {
                link.href = img.src;
                link.click();
            }
        }

        async function deactivateCurrentEvent() {
            if (!currentEventDetail) return;
            if (!confirm(`Deactivate "${currentEventDetail.name}"? Guests scanning the QR will see an inactive message.`)) return;

            try {
                const res = await fetch(`/api/platform/events/${currentEventDetail.id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'inactive' })
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.error || 'Failed to deactivate event');
                    return;
                }
                closeEventDetailModal();
                await loadEvents();
            } catch (e) {
                alert('Failed to deactivate event');
            }
        }
    </script>
</body>

</html>
