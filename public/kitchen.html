<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Board - QORTA</title>
    <base href="/">
    <link rel="stylesheet" href="css/main.css?v=6">
    <link rel="stylesheet" href="css/kitchen.css?v=6">
</head>

<body class="kitchen-page">
    <!-- Loading/Auth Check -->
    <div id="authLoading" class="auth-loading">
        <div class="auth-loading-content">
            <div class="spinner-large"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Header with Stats -->
    <header class="kitchen-header">
        <div class="kitchen-header-content">
            <div class="kitchen-title-group">
                <h1 class="kitchen-title">Kitchen Board</h1>
                <div class="activity-indicator">
                    <span class="activity-dot"></span>
                    <span>High Activity</span>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2" />
                        <path d="M12 6v6l4 2" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span id="avgPrepTime">14m Avg</span>
                </div>
                <div class="stat">
                    <span id="currentTime">12:45 PM</span>
                </div>
                <button id="logoutBtn" class="logout-btn" onclick="handleLogout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <polyline points="16 17 21 12 16 7" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <line x1="21" y1="12" x2="9" y2="12" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Kitchen Board Grid -->
    <main class="kitchen-board">
        <!-- NEW Orders Column -->
        <div class="status-column new">
            <div class="status-column-header">
                <div class="status-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2" />
                        <path d="M12 6v6h6" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span>New Orders</span>
                </div>
                <span class="status-count" id="newCount">0</span>
            </div>
            <div class="order-cards" id="newOrders">
                <div class="empty-column">No new orders</div>
            </div>
        </div>

        <!-- PREPARING Column -->
        <div class="status-column prep">
            <div class="status-column-header">
                <div class="status-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2v20M17 7h-6a5 5 0 0 0 0 10h6" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Preparing</span>
                </div>
                <span class="status-count" id="prepCount">0</span>
            </div>
            <div class="order-cards" id="prepOrders">
                <div class="empty-column">No orders in preparation</div>
            </div>
        </div>

        <!-- READY Column -->
        <div class="status-column ready">
            <div class="status-column-header">
                <div class="status-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M20 6L9 17l-5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Ready</span>
                </div>
                <span class="status-count" id="readyCount">0</span>
            </div>
            <div class="order-cards" id="readyOrders">
                <div class="empty-column">No orders ready</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js?v=7"></script>
    <script src="js/auth.js?v=7"></script>
    <script src="js/api.js?v=7"></script>
    <script src="js/kitchen.js?v=7"></script>
    <script>
        // Handle logout
        async function handleLogout() {
            await auth.logout();
            window.location.href = 'admin-login.html';
        }
    </script>
</body>

</html>
