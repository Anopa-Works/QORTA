<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORTA Admin - Login</title>
    <meta name="description" content="Admin login for QORTA restaurant management">
    <base href="/">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin-login.css">
</head>

<body>
    <main class="login-container">
        <!-- Logo -->
        <div class="login-logo">
            <h1>QORTA</h1>
            <p class="login-subtitle">Restaurant Admin</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@restaurant.com" required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <p class="login-footer">
            <a href="index.html">← Back to Menu</a>
        </p>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-login.js"></script>
</body>

</html>
