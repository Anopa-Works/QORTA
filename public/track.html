<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - QORTA</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/track.css">
    <link rel="stylesheet" href="/css/mobile-nav.css">
</head>

<body>

<!-- Full Screen Notification Overlay -->
<!-- Full Screen Notification Overlay -->
<div id="notificationOverlay" class="notification-overlay">
    <div class="notification-content">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            id="notificationIcon" style="margin-bottom: 16px;">
            <path d="M12 2v20M17 7h-6a5 5 0 0 0 0 10h6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h2 class="notification-title" id="notificationTitle">ORDER UPDATE</h2>
        <p class="notification-message" id="notificationMessage">Your order is being prepared!</p>
        <button class="btn-dismiss" onclick="dismissNotification()">Close</button>
    </div>
</div>

<!-- STRICT ORDER READY SCREEN (Initially Hidden) -->
<div id="orderReadyScreen"
    style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 10000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
    <div
        style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
        <!-- TITLE -->
        <h1
            style="font-size: 3rem; font-weight: 800; color: #16a34a; margin-bottom: 40px; text-transform: uppercase; letter-spacing: -1px;">
            ✅ Order Ready
        </h1>

        <!-- ORDER IDENTIFIER -->
        <div id="readyOrderNumber"
            style="font-size: 6rem; font-weight: 900; color: #1a1a1a; margin-bottom: 60px; line-height: 1;">
            #---
        </div>

        <!-- INSTRUCTION -->
        <div
            style="background: #fef2f2; border: 4px solid #dc2626; border-radius: 20px; padding: 30px; max-width: 90%; width: 100%;">
            <p style="font-size: 1.5rem; font-weight: 800; color: #dc2626; margin: 0; line-height: 1.4;">
                🔴 Show this screen at the counter to collect your order
            </p>
        </div>
    </div>

    <!-- STATUS FOOTER -->
    <div style="padding: 20px; width: 100%; border-top: 1px solid #eee;">
        <p style="color: #64748b; font-size: 1.1rem; font-weight: 500; margin: 0;">
            Preparing complete
        </p>
    </div>
</div>

<main class="tracking-container">
    <!-- Status Card (New Design) -->
    <div class="status-card preparing" id="statusCard">
        <div class="status-content">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                class="status-icon-large">
                <path d="M12 2v20M17 7h-6a5 5 0 0 0 0 10h6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="status-info">
                <div class="status-label">Current Status</div>
                <div class="status-text" id="statusText">PREPARING</div>
            </div>
        </div>
        <div class="status-footer">
            <div class="status-estimate" id="statusEstimate">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="2" />
                    <path d="M12 6v6l4 2" stroke-width="2" />
                </svg>
                <span>~15 mins</span>
            </div>
            <div class="status-footer-right">
                <div class="order-id-badge" id="orderNumber">#---</div>
                <div class="collection-instruction" style="display: none;" id="collectionInstruction">Show at counter to
                    collect your order.</div>
            </div>
        </div>
    </div>

    <!-- Timeline -->
    <div class="timeline-section">
        <h2 class="section-title">Timeline</h2>
        <div class="timeline" id="timeline">
            <!-- Timeline items loaded dynamically -->
        </div>
    </div>

    <!-- Order Details (Collapsible) -->
    <div class="order-details">
        <div class="order-details-header" onclick="toggleOrderDetails()">
            <div class="header-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" stroke-width="2" />
                    <rect x="9" y="3" width="10" height="18" rx="2" stroke-width="2" />
                </svg>
                <span>Receipt</span>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" id="detailsChevron"
                class="chevron">
                <path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>
        <div class="order-details-content" id="orderDetailsContent" style="display: none;">
            <div id="orderItemsList">
                <!-- Items loaded dynamically -->
            </div>
            <div class="detail-row detail-total">
                <span class="detail-label">Total</span>
                <span class="detail-value" id="orderTotal">$0.00</span>
            </div>
        </div>
    </div>

    <!-- Help Button -->
    <button class="btn help-btn">
        Need Help?
    </button>
</main>

<!-- Scripts -->
<script src="/js/api.js?v=4"></script>
<script src="/js/track.js?v=4"></script>

<!-- Mobile Navigation -->
<nav class="mobile-nav">
    <div class="mobile-nav-items">
        <a href="index.html" class="mobile-nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </div>
            <span>Home</span>
        </a>

        <div class="mobile-nav-item" style="position: relative; pointer-events: none;">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1" />
                    <circle cx="20" cy="21" r="1" />
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                </svg>
            </div>
            <span>Cart</span>
            <span class="cart-badge hidden" id="mobileCartBadge">0</span>
        </div>

        <a href="track.html" class="mobile-nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            </div>
            <span>Track</span>
        </a>
    </div>
</nav>
<script src="/js/mobile-nav.js?v=4"></script>
</body>

</html>
