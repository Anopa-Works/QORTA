<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - QORTA</title>
    <meta name="description" content="Restaurant admin dashboard">
    <base href="/">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <!-- Auth Loading -->
    <div id="authLoading" class="auth-loading">
        <div class="auth-loading-content">
            <div class="spinner-large"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="admin-header">
        <div class="admin-header-content">
            <div class="admin-title-group">
                <h1 class="admin-title">QORTA Admin</h1>
            </div>
            <div class="header-actions">
                <a href="#" id="kitchenLink" class="btn btn-secondary">Kitchen Board</a>
                <button id="logoutBtn" class="btn-icon" onclick="handleLogout()" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <polyline points="16 17 21 12 16 7" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <line x1="21" y1="12" x2="9" y2="12" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="orders" onclick="switchTab('orders')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9 17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" stroke-width="2" />
                <rect x="9" y="3" width="10" height="18" rx="2" stroke-width="2" />
            </svg>
            Orders
        </button>
        <button class="tab-btn" data-tab="menu" onclick="switchTab('menu')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 3h18v18H3zM3 9h18M9 21V9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Menu Items
        </button>
        <button class="tab-btn" data-tab="categories" onclick="switchTab('categories')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Categories
        </button>
    </nav>

    <main class="admin-main">
        <!-- Orders Tab (Default) -->
        <section id="ordersTab" class="tab-content active">
            <div class="section-header">
                <h2>Orders</h2>
                <div class="order-filters">
                    <button class="filter-btn active" data-filter="all" onclick="filterOrders('all')">All</button>
                    <button class="filter-btn" data-filter="NEW" onclick="filterOrders('NEW')">New</button>
                    <button class="filter-btn" data-filter="PREP" onclick="filterOrders('PREP')">Preparing</button>
                    <button class="filter-btn" data-filter="READY" onclick="filterOrders('READY')">Ready</button>
                </div>
            </div>

            <div id="ordersList" class="orders-list">
                <!-- Orders loaded dynamically -->
            </div>
        </section>

        <!-- Menu Items Tab -->
        <section id="menuTab" class="tab-content">
            <div class="section-header">
                <h2>Menu Items</h2>
                <button class="btn btn-primary" onclick="showAddItemModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19" stroke-width="2" stroke-linecap="round" />
                        <line x1="5" y1="12" x2="19" y2="12" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Add Item
                </button>
            </div>

            <div id="menuItemsList" class="items-grid">
                <!-- Menu items loaded dynamically -->
            </div>
        </section>

        <!-- Categories Tab -->
        <section id="categoriesTab" class="tab-content">
            <div class="section-header">
                <h2>Categories</h2>
                <button class="btn btn-primary" onclick="showAddCategoryModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19" stroke-width="2" stroke-linecap="round" />
                        <line x1="5" y1="12" x2="19" y2="12" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Add Category
                </button>
            </div>

            <div id="categoriesList" class="categories-list">
                <!-- Categories loaded dynamically -->
            </div>
        </section>
    </main>

    <!-- Add/Edit Item Modal -->
    <div id="itemModal" class="modal" style="display: none;" onclick="closeItemModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="itemModalTitle">Add Menu Item</h3>
                <button class="btn-icon" onclick="closeItemModal()">×</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <input type="hidden" id="itemId" name="id">

                <div class="form-group">
                    <label for="itemName">Name *</label>
                    <input type="text" id="itemName" name="name" required placeholder="Classic Burger">
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" name="description" rows="2"
                        placeholder="Juicy beef patty with fresh toppings..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemPrice">Price *</label>
                        <input type="number" id="itemPrice" name="price" step="0.01" min="0" required
                            placeholder="9.99">
                    </div>
                    <div class="form-group">
                        <label for="itemCategory">Category *</label>
                        <select id="itemCategory" name="category" required>
                            <option value="">Select category...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemImage">Image URL</label>
                    <input type="url" id="itemImage" name="imageUrl" placeholder="https://example.com/burger.jpg"
                        oninput="previewImage(this.value)">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="itemAvailable" name="available" checked>
                            Available
                        </label>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="itemFeatured" name="isFeatured">
                            Featured
                        </label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveItemBtn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="categoryModal" class="modal" style="display: none;" onclick="closeCategoryModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="categoryModalTitle">Add Category</h3>
                <button class="btn-icon" onclick="closeCategoryModal()">×</button>
            </div>
            <form id="categoryForm" onsubmit="saveCategory(event)">
                <input type="hidden" id="categoryId" name="id">

                <div class="form-group">
                    <label for="categoryName">Name *</label>
                    <input type="text" id="categoryName" name="name" required placeholder="Burgers">
                </div>

                <div class="form-group">
                    <label for="categoryOrder">Display Order</label>
                    <input type="number" id="categoryOrder" name="order" min="0" placeholder="1">
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="categoryActive" name="isActive" checked>
                        Active
                    </label>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" style="display: none;" onclick="closeDeleteModal()">
        <div class="modal-content modal-small" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Confirm Delete</h3>
                <button class="btn-icon" onclick="closeDeleteModal()">×</button>
            </div>
            <p id="deleteMessage">Are you sure you want to delete this item?</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
